[package]
name = "download-manager"
version = "0.2.0"
edition = "2021"
description = "Windows-first command-line download manager"
publish = false

# Phase 1 introduces the CLI shell, configuration, errors, and logging.
# Stack crates are added only when a phase first uses them (DOCS/phases.md).
[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
