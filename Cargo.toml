[package]
name = "swift-fetch"
version = "0.12.0"
edition = "2021"
description = "SwiftFetch — Windows-first command-line download manager"
publish = false

[features]
default = ["with-thiserror"]
with-thiserror = ["dep:thiserror"]

# Phase 1 introduces the CLI shell, configuration, errors, and logging.
# Stack crates are added only when a phase first uses them (DOCS/phases.md).
[dependencies]
# Phase 3: shared HTTP client for probe/transfers (architecture §3). A single
# configured client is reused for every request. No compression features: a
# transparent content transform would invalidate byte-range offsets, and
# Phase 3 must record only facts the responses actually support.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "http2"] }
# Phase 4: the body-streaming type of reqwest's public API (Response::chunk
# yields bytes::Bytes). reqwest already pulls this crate, so the tree gains
# nothing new; it only becomes *directly named* by engine code.
bytes = "1"
# Phase 10: ZIP extraction library. No default features: the default set
# pulls several codecs the engine does not use; DEFLATE is enough for
# real-world archives, keeping the dependency tree honest.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Phase 4: the sequential transfer engine is async production code — bounded
# transfer timeouts (time), partial-file streaming (fs, io-util). Phase 6 adds
# "sync" for the graceful-shutdown watch channel behind the shutdown handle
# (and the batch scheduler's bounded channels) — and "macros": resume.rs's
# `tokio::select!` races shutdown and body reads in production code; a plain
# `cargo build` only ever compiled because the gate recipe's `--all-targets`
# unified the dev-dependencies' features in (a latent Phase 6 gap pinned here
# so the product feature set is honest on its own). Phase 7 adds "rt": the
# file scheduler spawns a fixed pool of worker tasks and a producer task.
# Runtime bootstrap features stay in later phases per first-use (ADR-0003).
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "time", "sync", "macros", "rt"] }
# Phase 5: SQLite queue/recovery metadata (architecture §9). "bundled"
# compiles the SQLite engine itself, so no system SQLite library is needed
# and Windows behavior is reproducible; metadata only — the database never
# stores downloaded file contents.
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
thiserror = { version = "2", optional = true }
tracing = "0.1"
tracing-subscriber = "0.3"

# Phase 2: controlled HTTP test infrastructure (tests only).
# PostgreSQL-style server bodies stay out of the product binary: these crates
# compile test-support code under tests/ and are never linked into the CLI.
# hyper stays inside the layering approved by DOCS/architecture.md §3
# ("Hyper through the HTTP ecosystem"); per phase, none of these reach
# [dependencies] until the engine itself requires them.
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "test-util"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "client", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
sha2 = "0.10"
